name: Rust portable crates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    name: Portable crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Check portable crates
        run: cargo +1.97.1 check --locked -p voice-core -p voice-ports -p voice-application --all-targets

      - name: Lint portable crates
        run: cargo +1.97.1 clippy --locked -p voice-core -p voice-ports -p voice-application --all-targets --all-features -- -D warnings

      - name: Test portable crates
        run: cargo +1.97.1 test --locked -p voice-core -p voice-ports -p voice-application --all-targets
